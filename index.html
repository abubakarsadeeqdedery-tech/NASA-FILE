<style>

#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(6,9,22,.72);padding:16px;overflow:auto}
#modal .box{max-width:560px;width:100%;max-height:92%;overflow:auto;background:var(--navy);border:1px solid var(--lilac);border-radius:28px;padding:22px}
h1,h2{margin:.1em 0 .4em;font-weight:700}h1{font-size:1.7em}h2{font-size:1.25em;color:var(--orange)}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{padding:6px 8px;border-bottom:1px solid var(--navy2);text-align:left;vertical-align:top}
.tag{border-radius:8px;padding:1px 8px;font-size:.8em;font-weight:700;color:var(--navy)}.A{background:var(--blue)}.B{background:var(--lilac)}.C{background:var(--orange)}
.opt{display:block;width:100%;text-align:left;border-radius:18px;margin:8px 0;padding:12px 16px;background:var(--navy2);color:var(--white);border:1px solid var(--lilac)}
.opt:hover{background:#222f63}
@media(hover:none){#stick,#stick2{display:block}#act{bottom:calc(env(safe-area-inset-bottom,0px) + 165px)}}@media(hover:hover) and (pointer:fine){#stick,#stick2{display:none}#jump{display:none}}

button:disabled{opacity:.4;cursor:not-allowed}
/* ===== liquid-crystal glass UI ===== */
.card{background:rgba(255,255,255,.62);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 8px 24px rgba(11,42,102,.22)}

button::after,.chip::after,.opt::after{content:'';position:absolute;left:8%;right:8%;top:5%;height:44%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}
button:hover,.chip:hover,.opt:hover{filter:brightness(1.07) saturate(1.2)}button:active,.chip:active,.opt:active{transform:scale(.94,.9)}

/* ===== clearer, wider layout ===== */

.journey-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:#1265c0;margin-bottom:8px}.journey-progress{height:10px;background:#dbe9ff;border-radius:99px;overflow:hidden;margin:8px 0 16px}.journey-progress i{display:block;height:100%;background:linear-gradient(90deg,#55b5ff,#8b78ed);border-radius:99px;transition:width .3s}.orbi-note{background:#e8f4ff;border:1px solid #b7dcff;border-radius:16px;padding:12px 14px;margin:12px 0;color:#0b2a66}.journey-foot{font-size:.9em;opacity:.8}

/* Playable training interactions */
#act #dustGameBtn{display:block;min-width:104px;min-height:48px;font-size:.86em}
.tool-catch{height:84px;border-radius:18px;background:linear-gradient(90deg,#e5f4ff,#c4e5ff);display:flex;align-items:center;justify-content:flex-start;padding:12px;overflow:hidden;margin:12px 0}

/* ===== extra animations ===== */
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

function nasaSourcesHTML(){return `<div class="nasa-evidence"><h3>NASA / space-agency source check</h3><p><b>Important:</b> These links provide useful space-science context, but none of the supplied endpoints directly measures lunar dust coverage on a solar array or validates a specific panel-cleaning method. The 55% output in this scenario is an illustrative game setting, not NASA data.</p><ul>${NASA_SOURCES.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener noreferrer">${x.name}</a><br><small>${x.use}</small></li>`).join('')}</ul><div id="donki-live"><b>DONKI live space-weather check:</b> Loading recent event records…</div></div>`}
async function loadDONKIStatus(){const box=$('donki-live');if(!box)return;const end=new Date(),start=new Date(end.getTime()-7*86400000),fmt=d=>d.toISOString().slice(0,10);const key='DEMO_KEY';try{const url=`https://api.nasa.gov/DONKI/FLR?startDate=${fmt(start)}&endDate=${fmt(end)}&api_key=${encodeURIComponent(key)}`;let data;try{const c=JSON.parse(localStorage.getItem('zunoDonki')||'null');if(c&&Date.now()-c.t<3600000)data=c.d}catch(e){}if(!data){const r=await fetch(url);if(!r.ok)throw new Error(`NASA API returned ${r.status}`);data=await r.json();try{localStorage.setItem('zunoDonki',JSON.stringify({t:Date.now(),d:data}))}catch(e){}}const rows=Array.isArray(data)?data:[];box.innerHTML=`<b>✅ LIVE from api.nasa.gov (DONKI solar flares, last 7 days):</b> ${rows.length} record(s) returned. <small>Checked ${new Date().toLocaleString()}.</small> <small>These describe solar activity, not lunar dust or array contamination. Source: NASA DONKI.</small>`+(rows.length?`<ul>${rows.slice(0,3).map(e=>`<li>${e.classType||'Solar flare'} — ${e.beginTime||'time not listed'}</li>`).join('')}</ul>`:'');}catch(err){box.innerHTML='<b>🛰️ Live NASA solar data is not reachable from this page.</b> It works when the game is hosted on your own website with internet access (NASA may also limit free requests). The game still plays normally, and no NASA numbers are made up.';}}

function dustDecision(){modal(`<h2>Solar array inspection</h2><p><b>Visual status:</b> Dust layer detected on 3 of 3 arrays.</p><p><b>Power output:</b> 55% of clean baseline <span class="tag C">Illustrative demo value</span></p><p><b>Orbi:</b> “Dust can block sunlight from reaching solar cells. We should confirm the output change and choose a mitigation method designed for the array.”</p><p>What should the crew do?</p><button class="opt" data-d="inspect">A. Compare array output with the clean baseline, then activate a validated dust-mitigation system.</button><button class="opt" data-d="brush">B. Immediately scrub the panels with an ordinary brush.</button><button class="opt" data-d="ignore">C. Ignore the change and continue using the array normally.</button><p><small>Evidence note: DONKI = space-weather events; RadLab = radiation telemetry. Neither source measures lunar dust coverage or solar-array output. The 55% figure is simulated.</small></p><button class="g" id="showNASARefs">View NASA source notes</button>`);$('mb').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>dustOutcome(b.dataset.d));$('showNASARefs').onclick=()=>modal(`<h2>NASA source notes</h2>${nasaSourcesHTML()}<button class="g" id="backDust">Back to decision</button>`);loadDONKIStatus();$('backDust').onclick=()=>dustDecision()}

modal(`<h2>${good?'Decision accepted':'Try another approach'}</h2><p>${good?'You checked the evidence before acting and selected a validated mitigation approach.':'Orbi recommends checking the evidence and selecting a method validated for the solar-array hardware.'}</p><p><b>Learning point:</b> Dust mitigation is an engineering problem. Teams monitor performance, consider material and environmental constraints, and verify that a cleaning technology is suitable before using it.</p><p><span class="tag C">DEMO MODEL</span> The visual clearing is an illustrative animation, not a claim that a real panel was cleaned or that NASA measured a specific recovery percentage.</p><button class="o" id="dustReplay">Replay demo</button> <button class="g" id="dustExit">Return to Zuno</button>`);$('dustReplay').onclick=()=>{close();dustLayers.forEach(d=>d.visible=true);dustDemo()};$('dustExit').onclick=()=>{close();dustDemoActive=false;dustInspected=[false,false,false];$('obj').innerHTML='<b>Moon exploration</b><br>Continue your mission when ready.';say('Inspection complete. You can continue exploring the lunar base.','🤖')}}

 1:{html:`<h2>🚀 Launch checklist</h2><p>Tap each system after Mission Control confirms it is ready.</p><div class="row"><button class="chip" data-check="weather">☁️ Weather</button><button class="chip" data-check="engines">🔥 Engines</button><button class="chip" data-check="comms">📡 Communications</button></div><p id="task-feedback" aria-live="polite">0 of 3 checks complete</p><button class="o" id="task-submit" disabled>Request launch clearance</button>`,hint:'A safe launch needs weather, engine and communication checks.' ,mount(){const chosen=new Set();document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const k=b.dataset.check;chosen.has(k)?chosen.delete(k):chosen.add(k);b.classList.toggle('sel',chosen.has(k));$('task-feedback').textContent=chosen.size+' of 3 checks complete';$('task-submit').disabled=chosen.size!==3});$('task-submit').onclick=()=>journeyComplete('All three launch systems checked. Mission Control gives clearance.','You completed the launch checklist and earned 100 training points.')}},
